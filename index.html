    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0a0a0a;
            color: #f8f8f8;
            font-family: 'Montserrat', sans-serif;
            padding: 0;
            padding-bottom: 90px;
        }
        
        .header {
            background-color: #1a1a1a;
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid #333;
        }
        
        .header h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 2px;
            color: #c9a961;
        }
        
        .header p {
            font-size: 12px;
            color: #999;
            margin-top: 5px;
        }
        
        .products-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            padding: 15px;
            max-width: 100%;
        }
        
        .product-card {
            background: #1a1a1a;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s;
            border: 1px solid #333;
        }
        
        .product-card:hover {
            border-color: #c9a961;
            transform: translateY(-2px);
        }
        
        .product-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background: #0a0a0a;
        }
        
        .product-info {
            padding: 12px;
        }
        
        .product-info h3 {
            font-size: 13px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 5px;
            line-height: 1.3;
        }
        
        .product-info p {
            font-size: 11px;
            color: #999;
            margin-bottom: 8px;
            line-height: 1.4;
        }
        
        .product-price {
            font-size: 14px;
            font-weight: 700;
            color: #c9a961;
        }
        
        .footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: #1a1a1a;
            border-top: 1px solid #333;
            padding: 15px;
            text-align: center;
        }
        
        .whatsapp-btn {
            background-color: #c9a961;
            color: #000;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            font-size: 14px;
            transition: all 0.3s;
        }
        
        .whatsapp-btn:hover {
            background-color: #ddb870;
            transform: scale(1.05);
        }
        
        .whatsapp-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>

function renderProducts() {
  const grid = document.getElementById('productsGrid');
  grid.innerHTML = '';
  
  productos.forEach(producto => {
    const card = document.createElement('div');
    card.className = 'product-card';
    card.innerHTML = `
      <img src="${producto.img}" alt="${producto.nombre}" class="product-image" onerror="this.src='/pijama-1.jpg.jpg'">
      <div class="product-info">
        <h3>${producto.nombre}</h3>
        <p>${producto.hook}</p>
        <div class="product-price">$${producto.precio.toLocaleString()}</div>
      </div>
    `;
    grid.appendChild(card);
  });
}

function contactarWhatsApp() {
